<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EthioTime Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #d1fae5, #f8fafc 45%, #ffedd5);
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        color: #0f172a;
      }
      main {
        width: min(92vw, 540px);
        border-radius: 24px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 24px 54px -34px rgba(15, 23, 42, 0.48);
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
      }
      p {
        margin-top: 0.85rem;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        text-decoration: none;
        border-radius: 10px;
        background: #0f766e;
        color: #fff;
        padding: 0.65rem 0.95rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        EthioTime is still available for cached pages and tools. Reconnect to
        sync live reminders and latest holiday data.
      </p>
      <a href="./">Try again</a>
    </main>
  </body>
</html>
