name = "ethiotime-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"

# The Durable Object alarm does the timing now. This is only a backstop for an
# alarm that was lost, plus the nightly sweeping.
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "ReminderScheduler"

# SQLite-backed, which is what the free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReminderScheduler"]

[[d1_databases]]
# The name the code sees: worker/src/http.ts declares env.DB.
binding = "DB"
database_name = "ethiotime"
database_id = "bc16af2c-fc4e-4757-bebb-6dce6e0be82f"


[vars]
# The static site. Short links redirect here and CORS is limited to it.
APP_URL = "https://ethiotime.com"
TELEGRAM_BOT = "ethiotime_reminders_bot"

# Set with `wrangler secret put`:
#   TELEGRAM_TOKEN         bot token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  any random string, passed to setWebhook
